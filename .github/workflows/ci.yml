name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Run root tests
        run: npm test

      - name: Run backend tests
        run: |
          cd backend
          npm ci
          npm test

      - name: Create backend attestation
        run: |
          cd backend
          npx ts-node src/attestor.ts || true

      - name: Create root attestation
        run: |
          npx ts-node attestor.ts || true

      - name: Run smoke script
        run: npm run smoke

      - name: Upload logs (on failure)
        if: failure()
        run: |
          echo "Job failed - consider checking logs above"

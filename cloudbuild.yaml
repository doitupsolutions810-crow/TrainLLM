steps:
- name: 'gcr.io/cloud-builders/npm'
  args:
  - 'ci'
- name: 'gcr.io/cloud-builders/npm'
  args:
  - 'test'
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-t'
  - 'gcr.io/$PROJECT_ID/full-system-attestor'
  - '.'
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'full-system-attestor'
  - '--region'
  - 'us-central1'
  - '--image'
  - 'gcr.io/$PROJECT_ID/full-system-attestor'
  - '--platform'
  - 'managed'
images:
- 'gcr.io/$PROJECT_ID/full-system-attestor'
